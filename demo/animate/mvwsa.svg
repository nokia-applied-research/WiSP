<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7db1ff"/><stop offset="1" stop-color="#2f6bd6"/></linearGradient>
    <linearGradient id="gKvUsed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ce0c4"/><stop offset="1" stop-color="#0f9d7c"/></linearGradient>
    <linearGradient id="gFillD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bd6"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <linearGradient id="gFillS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6b85"/><stop offset="1" stop-color="#8593ad"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="600" rx="18" fill="#0b0f17" stroke="#22304a"/>
  <text x="40" y="44" fill="#e6edf6" font-size="24" font-weight="600">WiSP &#183; MV-WSA</text>
  <text x="240" y="44" fill="#7c8aa3" font-size="15">live KV &#8596; Expert split &#8212; one fixed GPU budget</text>
  <text x="40" y="70" fill="#7c8aa3" font-size="14">Qwen3-30B-A3B &#183; iso-VRAM &#183; AgentInstruct (db) &#183; real 24 GiB RTX 3090, allocated right</text>

  <!-- =================== TOP: schematic =================== -->
  <text x="40" y="112" fill="#7c8aa3" font-size="14">GPU memory budget (iso-VRAM &#8212; fixed total)</text>
  <rect x="40" y="122" width="820" height="70" rx="12" fill="#0a0e16" stroke="#22304a"/>

  <rect x="40" y="122" height="70" rx="12" fill="url(#gExp)">
    <animate attributeName="width" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.78;1" values="410;410;476;476"/>
  </rect>
  <text x="56" y="150" fill="#eaf1ff" font-size="14" font-weight="600">Resident experts</text>

  <rect y="122" height="70" rx="12" fill="#0e2722" stroke="#0a0e16">
    <animate attributeName="x" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.78;1" values="450;450;516;516"/>
    <animate attributeName="width" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.78;1" values="410;410;344;344"/>
  </rect>
  <rect y="122" width="145" height="70" rx="9" fill="url(#gKvUsed)">
    <animate attributeName="x" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.78;1" values="450;450;516;516"/>
    <animate attributeName="width" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.78;1" values="145;145;241;241"/>
  </rect>
  <text x="788" y="150" fill="#bdeee0" font-size="14" font-weight="600" text-anchor="end">KV pool</text>
  <!-- idle tag (step 2) -->
  <g opacity="0">
    <rect x="612" y="148" width="74" height="20" rx="6" fill="#241f12" stroke="#ffd166" stroke-opacity="0.45"/>
    <text x="649" y="162" fill="#ffd166" font-size="12" font-weight="700" text-anchor="middle">~56% idle</text>
    <animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.20;0.23;0.40;0.43;1" values="0;0;1;1;0;0"/>
  </g>
  <!-- boundary -->
  <rect y="118" width="3" height="78" fill="#ffd166">
    <animate attributeName="x" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.78;1" values="448;448;514;514"/>
  </rect>
  <!-- scan (step 3) -->
  <rect y="122" width="150" height="70" fill="#ffd166" opacity="0">
    <animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.40;0.43;0.57;0.60;1" values="0;0;0.20;0.20;0;0"/>
    <animate attributeName="x" dur="35s" repeatCount="indefinite" keyTimes="0;0.40;0.60;1" values="44;44;760;760"/>
  </rect>

  <!-- readout (crossfade) -->
  <text x="40" y="226" font-size="15" fill="#e6edf6">
    <tspan fill="#7db1ff" font-weight="700">cap 32</tspan> experts &#183; <tspan fill="#5ce0c4" font-weight="700">KV 2.79 GiB pool</tspan> &#183; KV used ~44%
    <animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.70;1" values="1;1;0;0"/>
  </text>
  <text x="40" y="226" font-size="15" fill="#e6edf6" opacity="0">
    <tspan fill="#ffd166" font-weight="700">cap 35</tspan> experts &#183; <tspan fill="#5ce0c4" font-weight="700">KV 1.53 GiB pool</tspan> &#183; KV used ~80%
    <animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.62;0.70;1" values="0;0;1;1"/>
  </text>

  <!-- expert cap slots (resident experts per layer; +3 light up on resize) -->
  <g>
    <rect x="40" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="56" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="72" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="88" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="104" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="120" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="136" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="152" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="168" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="184" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="200" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="216" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="232" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="248" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="264" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="280" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="296" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="312" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="328" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="344" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="360" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="376" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="392" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="408" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="424" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="440" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="456" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="472" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="488" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="504" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="520" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="536" y="240" width="12" height="12" rx="3" fill="url(#gExp)"/>
    <rect x="552" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="568" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="584" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="600" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="616" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="632" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="648" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="664" y="240" width="12" height="12" rx="3" fill="#1b2740" stroke="#243453"/>
    <rect x="552" y="240" width="12" height="12" rx="3" fill="#ffd166" opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.64;0.66;1" values="0;0;1;1"/></rect>
    <rect x="568" y="240" width="12" height="12" rx="3" fill="#ffd166" opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.69;0.71;1" values="0;0;1;1"/></rect>
    <rect x="584" y="240" width="12" height="12" rx="3" fill="#ffd166" opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.74;0.76;1" values="0;0;1;1"/></rect>
  </g>
  <text x="686" y="251" font-size="12" fill="#7c8aa3">experts resident / layer</text>

  <!-- race -->
  <text x="40" y="270" font-size="13" fill="#7c8aa3">end-to-end wall time (36-turn agent session)</text>
  <text x="40" y="300" font-size="14" fill="#7c8aa3">Static</text>
  <rect x="120" y="287" width="640" height="19" rx="8" fill="#0a0e16" stroke="#22304a"/>
  <rect x="120" y="287" height="19" rx="8" fill="url(#gFillS)" width="0">
    <animate attributeName="width" dur="35s" repeatCount="indefinite" keyTimes="0;0.80;0.97;1" values="0;0;640;640"/>
  </rect>
  <text x="772" y="301" font-size="14" fill="#e6edf6" opacity="0">1355 s
    <animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.96;0.975;1" values="0;0;1;1"/></text>

  <text x="40" y="336" font-size="14" fill="#7db1ff">Live</text>
  <rect x="120" y="323" width="640" height="19" rx="8" fill="#0a0e16" stroke="#22304a"/>
  <rect x="120" y="323" height="19" rx="8" fill="url(#gFillD)" width="0">
    <animate attributeName="width" dur="35s" repeatCount="indefinite" keyTimes="0;0.80;0.941;1" values="0;0;640;640"/>
  </rect>
  <text x="772" y="337" font-size="14" fill="#e6edf6" opacity="0">1138 s
    <animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.93;0.945;1" values="0;0;1;1"/></text>

  <!-- divider -->
  <line x1="40" y1="372" x2="860" y2="372" stroke="#22304a"/>

  <!-- =================== BOTTOM: explanation =================== -->
  <g>
    <rect x="40"  y="398" width="46" height="5" rx="2.5" fill="#243453"/>
    <rect x="95"  y="398" width="46" height="5" rx="2.5" fill="#243453"/>
    <rect x="150" y="398" width="46" height="5" rx="2.5" fill="#243453"/>
    <rect x="205" y="398" width="46" height="5" rx="2.5" fill="#243453"/>
    <rect x="260" y="398" width="46" height="5" rx="2.5" fill="#243453"/>
    <rect x="40"  y="398" width="46" height="5" rx="2.5" fill="#ffd166"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.18;0.21;1" values="1;1;0;0"/></rect>
    <rect x="95"  y="398" width="46" height="5" rx="2.5" fill="#ffd166"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.20;0.23;0.38;0.41;1" values="0;0;1;1;0;0"/></rect>
    <rect x="150" y="398" width="46" height="5" rx="2.5" fill="#ffd166"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.40;0.43;0.58;0.61;1" values="0;0;1;1;0;0"/></rect>
    <rect x="205" y="398" width="46" height="5" rx="2.5" fill="#ffd166"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.60;0.63;0.78;0.81;1" values="0;0;1;1;0;0"/></rect>
    <rect x="260" y="398" width="46" height="5" rx="2.5" fill="#ffd166"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.80;0.83;1" values="0;0;1;1"/></rect>
  </g>

  <!-- step 1 -->
  <g opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.18;0.21;1" values="1;1;0;0"/>
    <text x="40" y="436" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="1.4">STEP 1 / 5 &#183; THE SETUP</text>
    <text x="40" y="472" font-size="27" font-weight="600" fill="#e6edf6">One budget, two hungry tenants</text>
    <text x="40" y="512" font-size="15" fill="#c4d0e2"><tspan fill="#7db1ff" font-weight="700">&#9632;</tspan> Resident experts: MoE weights kept on-GPU so tokens never page from CPU.</text>
    <text x="40" y="542" font-size="15" fill="#c4d0e2"><tspan fill="#5ce0c4" font-weight="700">&#9632;</tspan> KV cache: attention state for the live, growing conversation.</text>
    <text x="40" y="572" font-size="15" fill="#c4d0e2"><tspan fill="#7c8aa3" font-weight="700">&#9632;</tspan> More of one means less of the other &#8212; what is the right split?</text>
  </g>
  <!-- step 2 -->
  <g opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.20;0.23;0.38;0.41;1" values="0;0;1;1;0;0"/>
    <text x="40" y="436" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="1.4">STEP 2 / 5 &#183; THE PROBLEM</text>
    <text x="40" y="472" font-size="27" font-weight="600" fill="#e6edf6">A static split wastes the budget</text>
    <text x="40" y="512" font-size="15" fill="#c4d0e2"><tspan fill="#5ce0c4" font-weight="700">&#9632;</tspan> KV pool sized once, offline, for the worst case &#8594; ~56% sits idle here.</text>
    <text x="40" y="542" font-size="15" fill="#c4d0e2"><tspan fill="#7db1ff" font-weight="700">&#9632;</tspan> Experts capped at 32 &#8594; the rest page from CPU every step.</text>
    <text x="40" y="572" font-size="15" fill="#c4d0e2"><tspan fill="#7c8aa3" font-weight="700">&#9632;</tspan> Idle KV bytes cannot help the experts that are actually starving.</text>
  </g>
  <!-- step 3 -->
  <g opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.40;0.43;0.58;0.61;1" values="0;0;1;1;0;0"/>
    <text x="40" y="436" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="1.4">STEP 3 / 5 &#183; OBSERVE</text>
    <text x="40" y="472" font-size="27" font-weight="600" fill="#e6edf6">MV-WSA measures the real demand</text>
    <text x="40" y="512" font-size="15" fill="#c4d0e2"><tspan fill="#5ce0c4" font-weight="700">&#9632;</tspan> Peak KV working set: ~44% of the allocated pool.</text>
    <text x="40" y="542" font-size="15" fill="#c4d0e2"><tspan fill="#7db1ff" font-weight="700">&#9632;</tspan> Expert miss rate high &#8594; bytes are worth more as residency.</text>
    <text x="40" y="572" font-size="15" fill="#c4d0e2"><tspan fill="#7c8aa3" font-weight="700">&#9632;</tspan> This agent trace simply does not need a large KV pool.</text>
  </g>
  <!-- step 4 -->
  <g opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.60;0.63;0.78;0.81;1" values="0;0;1;1;0;0"/>
    <text x="40" y="436" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="1.4">STEP 4 / 5 &#183; THE MOVE</text>
    <text x="40" y="472" font-size="27" font-weight="600" fill="#e6edf6">Reclaim idle KV &#8594; resident experts</text>
    <text x="40" y="512" font-size="15" fill="#c4d0e2"><tspan fill="#5ce0c4" font-weight="700">&#9632;</tspan> Shrink KV pool 2.79 &#8594; 1.53 GiB (still above the admission floor).</text>
    <text x="40" y="542" font-size="15" fill="#c4d0e2"><tspan fill="#7db1ff" font-weight="700">&#9632;</tspan> Grow residency cap 32 &#8594; 35 experts.</text>
    <text x="40" y="572" font-size="15" fill="#c4d0e2"><tspan fill="#ffd166" font-weight="700">&#9632;</tspan> 0 preemptions, output byte-identical &#8212; equimarginal rule, live.</text>
  </g>
  <!-- step 5 -->
  <g opacity="0"><animate attributeName="opacity" dur="35s" repeatCount="indefinite" keyTimes="0;0.80;0.83;1" values="0;0;1;1"/>
    <text x="40" y="436" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="1.4">STEP 5 / 5 &#183; THE WIN</text>
    <text x="40" y="472" font-size="27" font-weight="600" fill="#e6edf6">Same budget. Just split it right.</text>
    <text x="40" y="512" font-size="15" fill="#c4d0e2"><tspan fill="#7db1ff" font-weight="700">&#9632;</tspan> TTFT 95 &#8594; 75 s (1.27&#215; faster).</text>
    <text x="40" y="542" font-size="15" fill="#c4d0e2"><tspan fill="#5ce0c4" font-weight="700">&#9632;</tspan> decode 3.02 &#8594; 3.36 tok/s.</text>
    <text x="40" y="572" font-size="16" fill="#ffd166" font-weight="700"><tspan fill="#ffd166">&#9632;</tspan> end-to-end 1355 &#8594; 1138 s = 1.19&#215; faster, same hardware.</text>
  </g>
</svg>
